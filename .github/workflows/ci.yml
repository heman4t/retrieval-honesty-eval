name: ci

on:
  push:
  pull_request:

jobs:
  core:
    # The scoring core is stdlib-only; adapter tests skip here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[verifiers]"
      - run: python -m unittest discover -s tests -v
