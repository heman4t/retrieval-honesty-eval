[project]
name = "retrieval-honesty-eval"
version = "0.1.0"
description = "Offline, deterministic eval of whether a tool-using agent cites what it actually retrieved"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hemant Kumar" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["rag", "retrieval", "eval", "tool-use", "agents", "verifiers", "mcp"]

[project.optional-dependencies]
verifiers = ["verifiers>=0.3.0,<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval_honesty_eval"]

[tool.verifiers.eval]
num_examples = 14
rollouts_per_example = 1

[tool.ruff]
line-length = 120
target-version = "py311"
